app-id: io.github.abdelkader.Kardoo
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: kardoo

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

modules:
  - name: kardoo
    buildsystem: simple
    build-commands:
      - install -Dm755 kardoo /app/bin/kardoo
      - install -Dm644 io.github.abdelkader.Kardoo.desktop /app/share/applications/io.github.abdelkader.Kardoo.desktop
      - install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/io.github.abdelkader.Kardoo.png
    sources:
      - type: file
        path: kardoo
      - type: file
        path: icon.png
      - type: file
        path: io.github.abdelkader.Kardoo.desktop
